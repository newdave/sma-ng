name: CI

# No path filters: setup/**, *.yml.sample, docker/**, mise.toml and workflow
# changes all affect the checks below, and a skipped required check blocks merges.
# docker.yml builds and pushes the main image only after this workflow passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR runs are cancelled; runs on main are never cancelled so every
# main commit gets a result (and a gated image build).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # apt mirrors occasionally stall (one run hung 24 minutes here); bound
      # each attempt and retry. The apt archive cache was removed: the runner
      # image deletes downloaded .debs, so it never saved anything.
      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 sudo apt-get -o Acquire::Retries=3 update -qq \
              && timeout 150 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "::warning::ffmpeg install attempt $attempt failed; retrying"
          done
          exit 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup/requirements*.txt

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false

      - name: Set up venv and install dev deps
        run: mise run setup:deps:dev

      # test:cov runs pytest with coverage, then scripts/check-coverage-floor.py
      # (70% per-module floor for modules with >= 100 statements).
      - name: Run tests and per-module coverage floor
        run: mise run test:cov

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo "## Coverage"; venv/bin/python -m coverage report --format=markdown --skip-covered; } >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pre-commit runs ruff, bandit, markdownlint and shellcheck (one pinned
      # shellcheck-py version, the same one `mise run test:shell` uses).
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  checks:
    name: OpenAPI, docs, config sample and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup/requirements*.txt

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false

      - name: Set up venv and install dev deps
        run: mise run setup:deps:dev

      - name: Validate OpenAPI spec
        run: mise run test:openapi

      # markdownlint runs in the lint job via pre-commit; these catch broken
      # relative links, stale `mise run` references and docs with no wiki page.
      - name: Check docs links and task references
        run: venv/bin/python scripts/check_docs.py

      - name: Check wiki pages render
        run: mise run wiki:check

      - name: Check setup/sma-ng.yml.sample matches the schema
        run: mise run config:sample --check

      # Audits what ships (setup/requirements.txt) in a clean venv; dev-only
      # tooling is not part of the image or the wheel's runtime dependencies.
      - name: Audit runtime dependencies (pip-audit)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install -q --upgrade pip
          /tmp/audit/bin/pip install -q -r setup/requirements.txt pip-audit
          /tmp/audit/bin/pip-audit --skip-editable
