name: Release

# Runs on every push to main (no path filter: a release PR merged by a bot does
# not trigger workflows, so the next push of any kind must be able to cut the
# release). workflow_dispatch with a tag rebuilds that release's artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing sma-ng-vX.Y.Z tag to rebuild release artifacts for (empty: run release-please)"
        type: string
        default: ""

# Never cancel a release run: a newer push must not interrupt publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: nothing at workflow level; each job declares what it needs.
permissions: {}

jobs:
  # ── Step 1: Run release-please on every push to main ────────────────────────
  # Creates or updates the Release PR (bumps pyproject.toml and the manifest).
  # When that PR is merged, the next run creates the GitHub Release and the
  # sma-ng-vX.Y.Z tag and sets release_created=true for the publish jobs.
  #
  # RELEASE_PLEASE_TOKEN (optional, a GitHub App or fine-grained token with
  # contents + pull-requests write) makes the Release PR and tag trigger CI;
  # events created with the default GITHUB_TOKEN never start other workflows.
  release-please:
    name: Release Please
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
      patch: ${{ steps.detect.outputs.patch }}
      minor: ${{ steps.detect.outputs.minor }}
      major: ${{ steps.detect.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Detect release type from the version in the Release PR title
      # ("chore(main): release sma-ng X.Y.Z"), available on every run while
      # the PR is open. The PR JSON is passed as a plain string and parsed
      # with jq: fromJSON() in env: is evaluated even when the step is
      # skipped, and aborts the whole job on the run that creates a release
      # (no PR open then).
      #   patch: x.y.Z with Z > 0 (the default under always-bump-patch)
      #   minor: x.Y.0 with Y > 0 (explicit release-as override)
      #   major: X.0.0            (explicit release-as override)
      - name: Detect release type from PR title
        id: detect
        if: steps.rp.outputs.pr != ''
        env:
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          pr_title=$(jq -r '.title // ""' <<<"$PR_JSON")
          pr_number=$(jq -r '.number // ""' <<<"$PR_JSON")
          patch=false; minor=false; major=false
          if [[ "$pr_title" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            y="${BASH_REMATCH[2]}"; z="${BASH_REMATCH[3]}"
            if (( z > 0 )); then
              patch=true
            elif (( y > 0 )); then
              minor=true
            else
              major=true
            fi
          fi
          {
            echo "pr_number=$pr_number"
            echo "patch=$patch"
            echo "minor=$minor"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

  # ── Step 1b: Auto-merge patch releases (x.y.Z) ──────────────────────────────
  patch-auto-merge:
    name: Auto-merge patch release (x.y.Z)
    needs: release-please
    if: needs.release-please.outputs.pr_number != '' && needs.release-please.outputs.patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Enable auto-merge (squash)
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.release-please.outputs.pr_number }}
        # --auto requires branch protection with required checks; fall back
        # to a direct squash merge when auto-merge cannot be enabled.
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto \
            || gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash
          state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          echo "merged=$([ "$state" = MERGED ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ── Step 1b': Cut the release right after a direct merge ────────────────────
  # A merge made with GITHUB_TOKEN starts no workflow, so without this the
  # release would wait for the next push. Running release-please again sees
  # the merged Release PR and creates the release + tag now.
  release-after-merge:
    name: Create release after merge
    needs: patch-auto-merge
    if: needs.patch-auto-merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Step 1c: Label and notify minor releases (x.Y.0) ──────────────────────────
  # Minor releases require manual approval. The label is idempotent; the
  # comment is posted once per PR (marker below), not on every push.
  minor-approval-gate:
    name: Gate minor release (x.Y.0) for approval
    needs: release-please
    if: needs.release-please.outputs.pr_number != '' && needs.release-please.outputs.minor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Add label and request approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.release-please.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "type: minor-release"
          marker="<!-- sma-minor-release-gate -->"
          if gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "approval comment already posted"
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "$marker
          🟡 **Minor release (x.Y.0) detected.** This requires manual approval before merge. Review the changelog and approve when ready."
          fi

  # Major releases (X.0.0): no automatic action; review and merge the Release PR by hand.

  # ── Step 2: Resolve which release (if any) to publish ───────────────────────
  # A release created by either release-please run, or the tag given to a
  # manual workflow_dispatch (rebuilds that release's artifacts and image).
  release-info:
    name: Resolve release
    needs: [release-please, release-after-merge]
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       needs.release-after-merge.outputs.release_created == 'true' ||
       inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Tag and version
        id: info
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name || needs.release-after-merge.outputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^sma-ng-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  # ── Step 3a: Build & attach dist artifacts to the GitHub Release ────────────
  publish:
    name: Build & publish release artifacts
    needs: release-info
    if: always() && needs.release-info.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-info.outputs.tag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup/requirements*.txt

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: false

      - name: Set up venv and install dev deps
        run: mise run setup:deps:dev

      - name: Build wheel and sdist
        run: mise run build:dist

      - name: Upload dist to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          files: dist/*

  # ── Step 3b: Release image (multi-arch, semver tags) ────────────────────────
  # Built here rather than on the tag: tags created with GITHUB_TOKEN start no
  # workflow, and release-please tags are sma-ng-vX.Y.Z.
  docker:
    name: Release image
    needs: release-info
    if: always() && needs.release-info.result == 'success'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ needs.release-info.outputs.tag }}
      version: ${{ needs.release-info.outputs.version }}
