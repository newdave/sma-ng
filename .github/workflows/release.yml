name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "**/*.md"
      - "resources/docs.html"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing at workflow level; each job declares what it needs.
permissions: {}

jobs:
  # ── Step 1: Run release-please on every push to main ────────────────────────
  # Creates or updates a "Release PR" that bumps pyproject.toml and the
  # release-please manifest. Grouping via group-pull-request-title-pattern
  # batches commits by release type. When the Release PR is merged (automated
  # for patches, manual for minor/major), release-please creates the GitHub
  # Release and v* tag, then sets release_created=true for publish jobs.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
      version: ${{ steps.rp.outputs.version }}
      patch: ${{ steps.detect.outputs.patch }}
      minor: ${{ steps.detect.outputs.minor }}
      major: ${{ steps.detect.outputs.major }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Detect release type from the version in the Release PR title.
      # steps.rp.outputs.version is only populated on release-creation runs
      # (after the Release PR merges), never on PR create/update runs, so
      # gating on it meant the detect steps — and therefore auto-merge —
      # never fired while the PR was open. The PR title
      # ("chore(main): release sma-ng X.Y.Z") is available on every run.
      # Patch: x.y.Z with Z > 0 (the default under always-bump-patch)
      # Minor: x.Y.0 with Y > 0 (explicit release-as override)
      # Major: X.0.0 (explicit release-as override)
      - name: Detect release type from PR title
        id: detect
        if: steps.rp.outputs.pr
        env:
          PR_TITLE: ${{ fromJSON(steps.rp.outputs.pr).title }}
        run: |
          pr_title="$PR_TITLE"
          patch=false; minor=false; major=false
          if [[ "$pr_title" =~ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            y="${BASH_REMATCH[2]}"; z="${BASH_REMATCH[3]}"
            if (( z > 0 )); then
              patch=true
            elif (( y > 0 )); then
              minor=true
            else
              major=true
            fi
          fi
          {
            echo "patch=$patch"
            echo "minor=$minor"
            echo "major=$major"
          } >> "$GITHUB_OUTPUT"

  # ── Step 1b: Auto-merge patch releases (x.y.Z) ──────────────────────────────
  # Patch releases auto-merge immediately after checks pass.
  patch-auto-merge:
    name: Auto-merge patch release (x.y.Z)
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        # --auto requires branch protection with required checks; fall back
        # to a direct squash merge when auto-merge cannot be enabled.
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto \
            || gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash

  # ── Step 1c: Label and notify minor releases (x.Y.z) ──────────────────────────
  # Minor releases require manual approval—label PR and post notification.
  minor-approval-gate:
    name: Gate minor release (x.Y.z) for approval
    needs: release-please
    if: needs.release-please.outputs.pr != '' && needs.release-please.outputs.minor == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add label and request approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "type: minor-release"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "🟡 **Minor release (x.Y.z) detected.** This requires manual approval before merge. Review the changelog and approve when ready."

  # ── Step 1d: Major releases (X.y.z) require manual workflow_dispatch ──────────
  # No automatic action for major releases; they must be triggered explicitly.

  # ── Step 2a: Build & attach dist artifacts to the GitHub Release ─────────────
  # Runs only when release-please actually created a release (when the Release
  # PR was merged). The version in pyproject.toml is the single source of truth.
  publish:
    name: Build & publish release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup/requirements*.txt

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false

      - name: Set up venv and install dev deps
        run: mise run setup:deps:dev

      - name: Build wheel and sdist
        run: mise run build:dist

      - name: Upload dist to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  # ── Step 2b: Docker image ───────────────────────────────────────────────────
  # docker.yml triggers automatically on the v* tag that release-please creates.
  # It handles QEMU, multi-arch (amd64 + arm64), semver tags, and latest.
  # Nothing to do here — no duplication needed.
