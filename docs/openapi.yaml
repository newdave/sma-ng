openapi: "3.1.0"
info:
  title: SMA-NG Daemon API
  description: |
    HTTP webhook server for media conversion automation.

    Authentication is optional. When an API key (or HTTP Basic credentials) is configured, every endpoint
    requires it except the public ones: `/`, `/dashboard`, `/dashboard/metrics`, `/admin`, `/docs` and
    `/docs/{page}`, `/favicon.png`, `/health` and `/status`. `/health` and `/status` answer without credentials
    with a minimal view that hides node ids and job paths. Send the key as `X-API-Key: <key>` or
    `Authorization: Bearer <key>`.

    Request bodies larger than 1 MiB are rejected with `413`. A non-integer or negative `limit`, `offset`, `days`
    or `lines` value returns `400`. Any unknown path returns `404`.
  version: "1.0.0"

servers:
  - url: http://127.0.0.1:8585
    description: Default local daemon

security:
  - apiKey: []
  - bearerToken: []

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
    bearerToken:
      type: http
      scheme: bearer

  schemas:
    JobSubmit:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: File or directory as the daemon sees it
        kind:
          type: string
          enum: [convert, preview, repair, audit, rename]
          default: convert
        args:
          description: Extra tool arguments; -c, --config, -i, --input and --job-id are rejected
          oneOf:
            - type: array
              items:
                type: string
            - type: string
        profile:
          type: string
          description: Profile for convert and preview; defaults to path routing
        priority:
          type: integer
          description: Queue priority (default 0; preview 100)
    GenericSubmit:
      type: object
      required: [path]
      properties:
        path:
          type: string
        args:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
        config:
          type: string
          description: >
            Config override (bypasses path routing). Must be the daemon's loaded config file;
            any other path is rejected with 400.
        max_retries:
          type: integer
    Job:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [convert, preview, repair, audit, rename]
          description: Which tool the job runs (see POST /jobs)
        path:
          type: string
        config:
          type: string
        args:
          type: string
          description: JSON-encoded list of extra arguments
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        worker_id:
          type: integer
          nullable: true
        node_id:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        retry_count:
          type: integer
          default: 0
        max_retries:
          type: integer
          default: 0
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: object
          nullable: true
          description: Live conversion progress, present only on GET /jobs/{id} while the job is running
          properties:
            elapsed:
              type: string
              description: Time spent on the conversion, as HH:MM:SS
            timecode:
              type: string
              description: Output position reached, as HH:MM:SS
            percent:
              type: number
              description: Percent complete, when the source duration is known
            fps:
              type: number
            speed:
              type: string
              example: 1.25x
            bitrate:
              type: string
              example: 4210.5k
        priority:
          type: integer
          default: 0
          description: Scheduling priority — higher values run first among pending jobs (FIFO within same priority)
        log_name:
          type: string
          nullable: true
          description: Log file stem for the config used by this job (e.g. "sma-ng")
        encoder_backend:
          type: string
          nullable: true
          description: "Encoder backend that produced the output: qsv, vaapi, nvenc, videotoolbox, amf, software or copy"
        encoder_name:
          type: string
          nullable: true
          description: Video encoder (codec name) that produced the output, after any fallback swap
        source_duration_seconds:
          type: number
          nullable: true
          description: Source duration in seconds
        source_video_codec:
          type: string
          nullable: true
          description: Source video codec (ffprobe name)
        source_video_width:
          type: integer
          nullable: true
          description: Source video width in pixels
        source_video_height:
          type: integer
          nullable: true
          description: Source video height in pixels
        source_audio_codec:
          type: string
          nullable: true
          description: First source audio stream codec
        source_audio_channels:
          type: integer
          nullable: true
          description: First source audio stream channel count
        source_hdr:
          type: string
          nullable: true
          description: "Source dynamic range: sdr, hdr10, hdr10plus, dolby_vision or hlg. Dolby Vision and HDR10+ show only when the probe exposes their side data, otherwise hdr10"
        dest_video_codec:
          type: string
          nullable: true
          description: Output video codec
        dest_video_width:
          type: integer
          nullable: true
          description: Output video width in pixels
        dest_video_height:
          type: integer
          nullable: true
          description: Output video height in pixels
        dest_audio_codec:
          type: string
          nullable: true
          description: First output audio stream codec
        dest_audio_channels:
          type: integer
          nullable: true
          description: First output audio stream channel count
        dest_hdr:
          type: string
          nullable: true
          description: "Output dynamic range: sdr, hdr10, hdr10plus, dolby_vision or hlg. Dolby Vision and HDR10+ show only when the probe exposes their side data, otherwise hdr10"

    JobStats:
      type: object
      description: >-
        Lifetime job counts per status plus total. Each count is the live rows in the jobs table plus
        the job_stats_archive table, which keeps finished jobs (completed, failed, cancelled) that were
        deleted by retention, POST /cleanup, the admin delete actions or bulk delete, and any baseline
        added with POST /stats/archive. Deleted pending and running jobs are not counted.
      additionalProperties:
        type: integer
      example:
        pending: 3
        running: 1
        completed: 150
        failed: 2
        cancelled: 0
        total: 156

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LogFile:
      type: object
      properties:
        name:
          type: string
          description: Log name (config file stem, e.g. "sma-ng")
        file:
          type: string
          description: Absolute path to the log file
        size:
          type: integer
          description: Current file size in bytes
        mtime:
          type: string
          format: date-time
          description: Last-modified timestamp in the daemon host's local timezone, including UTC offset

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Entry timestamp in the daemon host's local timezone, including UTC offset
        level:
          type: string
          enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        message:
          type: string
        job_id:
          type: integer
          nullable: true

    LibraryAuditRun:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [queued, enumerating, probing, completed, failed]
        triggered_by:
          type: string
          nullable: true
          description: "Source of the run: scheduled:<node-id>, api:<node-id>, or cli"
        scope_paths:
          type: array
          items:
            type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        total_units:
          type: integer
        done_units:
          type: integer
        error:
          type: string
          nullable: true
        per_node_progress:
          type: array
          description: Distributed-workload contribution per node for the run
          items:
            type: object
            properties:
              claimed_by:
                type: string
                nullable: true
              units:
                type: integer

    LibraryFinding:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [ffprobe_failed, orphan_sidecar, leftover_tmp, preconv_original, duplicate_id]
        path:
          type: string
        details:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [open, acked, dismissed, resolved]
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        acked_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        audit_id:
          type: integer
          nullable: true

paths:
  /health:
    get:
      summary: Daemon health check
      description: >-
        Without credentials, or with a wrong key, returns a minimal liveness view (status, version, uptime_seconds,
        jobs) and never a 401. With a valid API key returns the full detail (node, commit, workers, active and
        waiting jobs, hardware). The minimal view hides the node id and every job path.
      security:
        - {}
        - apiKey: []
        - bearerToken: []
      operationId: getHealth
      tags: [monitoring]
      responses:
        "200":
          description: Daemon is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  node:
                    type: string
                    description: Authenticated callers only
                  version:
                    type: string
                    description: SMA-NG release version of this node (from package metadata)
                    example: 3.1.0
                  commit:
                    type: string
                    description: >-
                      Git commit the running image was built from (baked in via the
                      SMA_GIT_SHA build-arg). "unknown" on bare-metal/source runs.
                    example: 2e26970
                  started_at:
                    type: string
                    format: date-time
                    description: Daemon start time in the daemon host's local timezone, including UTC offset
                  uptime_seconds:
                    type: integer
                  workers:
                    type: integer
                  jobs:
                    $ref: "#/components/schemas/JobStats"
                  active:
                    type: object
                    description: Map of config path → list of active job objects
                  waiting:
                    type: object
                    description: Map of config path → waiting job count
                  gpu_status:
                    type: string
                    description: Authenticated callers only. Hardware acceleration health, or "unknown"
                  selected_backend:
                    type: string
                    description: Authenticated callers only. Encoder backend in use, for example qsv or software
                  capabilities:
                    type: object
                    description: Authenticated callers only. Detected encoder capabilities
                  fallback:
                    type: array
                    description: Authenticated callers only. Per-tier hardware fallback counters
                    items:
                      type: object

  /metrics:
    get:
      summary: Prometheus metrics
      description: Prometheus text exposition. Requires credentials when an API key or basic auth is configured (series carry the node id).
      security:
        - apiKey: []
        - bearerToken: []
      operationId: getPrometheusMetrics
      tags: [monitoring]
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid credentials

  /status:
    get:
      summary: Cluster status
      description: >-
        Without credentials, or with a wrong key, returns a minimal view (status, version, job counts). With a
        valid API key returns full cluster detail (nodes, hosts, active jobs).
      security:
        - {}
        - apiKey: []
        - bearerToken: []
      operationId: getStatus
      tags: [monitoring]
      responses:
        "200":
          description: Cluster or local status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Present only in the minimal unauthenticated view
                    example: ok
                  version:
                    type: string
                    description: SMA-NG release version of the local node answering the request
                    example: 3.1.0
                  commit:
                    type: string
                    description: >-
                      Git commit of the local node answering the request. Per-node build
                      info for other cluster members is carried in each cluster[] entry.
                    example: 2e26970
                  cluster:
                    type: array
                    description: Authenticated only. One entry per known node, including its version and last-seen time
                    items:
                      type: object
                  jobs:
                    $ref: "#/components/schemas/JobStats"

  /stats:
    get:
      summary: Job statistics
      description: Lifetime counts. Deleting finished jobs does not lower them (see JobStats).
      operationId: getStats
      tags: [jobs]
      responses:
        "200":
          description: Job counts by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

  /stats/archive:
    post:
      summary: Add a baseline to the lifetime job totals
      description: >-
        One-off seeding for jobs deleted before lifetime totals existed. Adds each count to
        job_stats_archive, so /stats, /health job counts and /api/metrics?window=all include it.
        Counts are added, not replaced: send each baseline once. Every key is optional, but the
        body must hold at least one. Values must be non-negative integers; unknown keys,
        negatives, decimals, strings, booleans and invalid JSON return 400.
      operationId: addArchivedJobCounts
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                completed:
                  type: integer
                  minimum: 0
                failed:
                  type: integer
                  minimum: 0
                cancelled:
                  type: integer
                  minimum: 0
            example:
              completed: 19000
              failed: 120
              cancelled: 15
      responses:
        "200":
          description: Counts added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: object
                    additionalProperties:
                      type: integer
                  stats:
                    $ref: "#/components/schemas/JobStats"
        "400":
          description: Invalid JSON, unknown status key, or a value that is not a non-negative integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid credentials

  /api/metrics:
    get:
      summary: Cluster job metrics (JSON)
      description: >-
        PostgreSQL only; SQLite returns 503. With window=all, kpis.completed, kpis.failed,
        kpis.cancelled, kpis.total and kpis.failure_rate_pct include the archived counts of deleted
        finished jobs (job_stats_archive). The 24h, 7d and 30d windows, and the duration, size,
        encoder, failure-category, time-series and per-node figures, count live rows only.
      operationId: getMetricsJson
      tags: [monitoring]
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: ["24h", "7d", "30d", "all"]
            default: 24h
      responses:
        "200":
          description: Metrics for the window (available, window, kpis, timeseries, nodes, encoders, failures)
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Missing or invalid credentials
        "503":
          description: Not in distributed (PostgreSQL) mode

  /jobs:
    get:
      summary: List jobs
      operationId: listJobs
      tags: [jobs]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: config
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Match part of the job path. A search ignores offset and returns at least 200 rows.
          schema:
            type: string
        - name: profile
          in: query
          description: Only jobs queued with this routing profile. `library` is an alias.
          schema:
            type: string
        - name: library
          in: query
          description: Alias of `profile`.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort order. An unknown value falls back to `created`.
          schema:
            type: string
            enum: [created, created_asc, priority, profile, library, status]
            default: created
        - name: limit
          in: query
          description: Page size. Values above 500 are clamped to 500. Job rows omit ffmpeg_stderr and output (use the per-job endpoints).
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
    post:
      summary: Submit a job of any kind
      description: >
        convert behaves like POST /webhook/generic. Other kinds queue one job for
        the path without the convert-only default args or same-extension skip;
        preview needs a file. PostgreSQL clusters return 409 while an online node
        lacks the job-kinds-v1 capability.
      operationId: submitJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSubmit"
      responses:
        "200":
          description: Duplicate (same kind and normalised path already pending or running) or skipped
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: integer
        "400":
          description: Invalid request or path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Path is outside the configured media roots (checked after resolving `..` and symlinks)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cluster node does not support job kinds yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body is larger than 1 MiB
        "500":
          description: Internal error, for example a failing routing-profile lookup. The caller should retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{id}:
    get:
      summary: Get a specific job
      operationId: getJob
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details (includes progress field when running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid job ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{id}/ffmpeg-stderr:
    get:
      summary: Get the stored ffmpeg stderr for a failed job
      description: >
        Returns the full ffmpeg command and stderr captured from the job's
        failed conversion attempts, ingested from the on-disk sidecar files
        after the job was marked failed.
      operationId: getJobFfmpegStderr
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stored ffmpeg cmd + stderr
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid job ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Job not found or no stderr stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{id}/output:
    get:
      summary: Read a job's captured tool output
      description: >
        Tool output without FFmpeg progress lines. The daemon keeps the newest
        1 MiB per job. Offsets are byte positions in the job's whole output;
        an offset older than X-Output-Dropped starts at the oldest stored byte.
      operationId: getJobOutput
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Output from the offset onwards
          headers:
            X-Next-Offset:
              description: Offset to request next
              schema:
                type: integer
            X-Output-Dropped:
              description: Bytes discarded from the start of the output
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid job ID or offset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /paths:
    get:
      summary: Path roots this daemon serves
      description: >
        daemon.routing match prefixes, scan-paths, audit.paths and path-rewrites
        sources. Clients use it to reject paths the daemon cannot see.
      operationId: getPaths
      tags: [jobs]
      responses:
        "200":
          description: Path roots
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots:
                    type: array
                    items:
                      type: string

  /jobs/{id}/requeue:
    post:
      summary: Requeue a specific failed job
      operationId: requeueJob
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  requeued:
                    type: boolean
                  job_id:
                    type: integer
        "400":
          description: Invalid job ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job cannot be requeued (not in failed state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{id}/cancel:
    post:
      summary: Cancel a running or pending job
      description: Terminates the conversion subprocess if active; marks pending jobs as cancelled.
      operationId: cancelJob
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
                  job_id:
                    type: integer
        "400":
          description: Invalid job ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job cannot be cancelled (only pending or running jobs can be)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/{id}/priority:
    post:
      summary: Set the priority of a pending job
      description: Higher priority jobs are picked up first. Only works on pending jobs.
      operationId: setJobPriority
      tags: [jobs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority:
                  type: integer
                  description: New priority value (higher = runs sooner, default 0)
      responses:
        "200":
          description: Priority updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: integer
                  priority:
                    type: integer
        "400":
          description: Invalid job ID or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Job is not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /jobs/requeue:
    post:
      summary: Requeue all failed jobs
      operationId: requeueAllJobs
      tags: [jobs]
      parameters:
        - name: config
          in: query
          description: Limit requeue to jobs for a specific config file
          schema:
            type: string
      responses:
        "200":
          description: Jobs requeued
          content:
            application/json:
              schema:
                type: object
                properties:
                  requeued:
                    type: integer

  /jobs/bulk:
    post:
      summary: Apply an action to a set of jobs by id
      description: |
        Bulk action endpoint used by the dashboard's multi-select toolbar.
        Supports `requeue` (only failed jobs transition; others are skipped),
        `cancel` (kills the running subprocess if any, otherwise marks the
        pending row cancelled — completed/failed jobs are skipped), and
        `delete` (removes the row outright; running subprocesses are
        cancelled first to avoid orphaning the ffmpeg child).
      operationId: bulkJobsAction
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action:
                  type: string
                  enum: [requeue, cancel, delete]
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
      responses:
        "200":
          description: Per-id outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                  succeeded:
                    type: array
                    items:
                      type: integer
                  skipped:
                    type: array
                    description: Jobs that exist but couldn't transition
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        reason:
                          type: string
                          enum: [not_failed, not_cancellable]
                        status:
                          type: string
                  not_found:
                    type: array
                    items:
                      type: integer
        "400":
          description: Invalid body or unknown action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhook/generic:
    post:
      summary: Submit a conversion job (file or directory)
      description: >
        Plain-text body (the path) or JSON. A directory queues one job per media file. The path must lie inside
        a configured media root. An optional `X-SMA-Request-Source` header labels the request in the metrics.
      operationId: submitGeneric
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericSubmit"
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Duplicate (same normalised path already pending or running) or skipped (same extension, recycle bin, or reason recently_completed with the completed job_id when the path finished within job-dedupe-window-seconds)
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: integer
        "400":
          description: >
            Invalid request or path; args not a list of strings; args containing -c, --config, -i, --input or
            --job-id; config not the daemon's loaded config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Path is outside the configured media roots (checked after resolving `..` and symlinks)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body is larger than 1 MiB
        "500":
          description: Unexpected error, such as a failing routing-profile lookup. The caller should retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /convert:
    post:
      summary: Submit a conversion job (alias of /webhook/generic)
      description: Same behaviour as POST /webhook/generic. POST / is a second alias.
      operationId: submitConvert
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericSubmit"
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Duplicate (same normalised path already pending or running) or skipped (same extension, recycle bin, or reason recently_completed with the completed job_id when the path finished within job-dedupe-window-seconds)
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: integer
        "400":
          description: >
            Invalid request or path, forbidden args, a config that is not the daemon's own, or a path with no
            routing match while daemon.strict-routing is true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Path is outside the configured media roots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /:
    get:
      summary: Redirect to the dashboard
      operationId: getRoot
      tags: [web]
      security:
        - {}
      responses:
        "301":
          description: Redirects to /dashboard
    post:
      summary: Submit a conversion job (alias of /webhook/generic)
      description: Same behaviour as POST /webhook/generic.
      operationId: submitRoot
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericSubmit"
          text/plain:
            schema:
              type: string
      responses:
        "202":
          description: Queued
        "200":
          description: Duplicate or skipped
        "400":
          description: Invalid request or path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Path is outside the configured media roots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dashboard:
    get:
      summary: Web dashboard
      description: HTML shell. It loads its data from the authenticated API and asks for the API key in a dialog.
      operationId: getDashboard
      tags: [web]
      security:
        - {}
      responses:
        "200":
          description: Dashboard page
          content:
            text/html:
              schema:
                type: string

  /dashboard/metrics:
    get:
      summary: Metrics page
      description: HTML shell. Its data comes from the authenticated GET /api/metrics.
      operationId: getMetricsPage
      tags: [web]
      security:
        - {}
      responses:
        "200":
          description: Metrics page
          content:
            text/html:
              schema:
                type: string

  /admin:
    get:
      summary: Admin page
      description: HTML shell for node management, cluster logs, the shared base config and destructive actions.
      operationId: getAdminPage
      tags: [web]
      security:
        - {}
      responses:
        "200":
          description: Admin page
          content:
            text/html:
              schema:
                type: string

  /docs:
    get:
      summary: Documentation index
      description: The operator documentation, rendered from the files shipped with the daemon.
      operationId: getDocsIndex
      tags: [web]
      security:
        - {}
      responses:
        "200":
          description: Documentation page
          content:
            text/html:
              schema:
                type: string

  /docs/{page}:
    get:
      summary: Documentation page
      description: Renders docs/<page>.md. `changelog` renders the release changelog.
      operationId: getDocsPage
      tags: [web]
      security:
        - {}
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
            example: daemon
      responses:
        "200":
          description: Documentation page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: No such page

  /favicon.png:
    get:
      summary: Logo image
      operationId: getFavicon
      tags: [web]
      security:
        - {}
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Logo file not found

  /webhook/sonarr:
    post:
      summary: Native Sonarr webhook endpoint
      description: |
        Accepts a native Sonarr webhook payload for any event type.
        Extracts `episodeFile.path`, `series.tvdbId`, and episode numbers, then
        queues the file for conversion.  Test events return 200 without queuing.
        Only `Download` is queued for conversion. Every other eventType (Grab,
        Rename, file/series/movie delete, Health, ...) is forwarded unchanged to
        `/triggers/<sonarr|radarr>` on each matching `services.autoscan` instance
        and answered with 200 (`forwarded` / `ignored`) or 502 when every forward fails.
      operationId: sonarrWebhook
      tags: [conversion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType:
                  type: string
                  description: "`Download` queues a job, `Test` is acknowledged, all others are forwarded to Autoscan"
                episodeFile:
                  type: object
                  properties:
                    path:
                      type: string
                      description: Absolute path to the imported episode file
                series:
                  type: object
                  properties:
                    tvdbId:
                      type: integer
                    imdbId:
                      type: string
                episodes:
                  type: array
                  items:
                    type: object
                    properties:
                      seasonNumber:
                        type: integer
                      episodeNumber:
                        type: integer
            example:
              eventType: Download
              episodeFile:
                path: /mnt/unionfs/Media/TV/Show/Season 1/S01E01.mkv
              series:
                tvdbId: 73871
              episodes:
                - seasonNumber: 1
                  episodeNumber: 1
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: queued
                  job_id:
                    type: integer
                  path:
                    type: string
                  config:
                    type: string
        "200":
          description: Test event acknowledged, duplicate job, or non-Download event forwarded/ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: "`ok`, `forwarded`, or `ignored` (no matching Autoscan instance)"
                  eventType:
                    type: string
                  forwarded:
                    type: array
                    items:
                      type: object
                      properties:
                        instance:
                          type: string
                        status:
                          type: integer
                          nullable: true
                          description: HTTP status from Autoscan, null when the request failed
        "400":
          description: Bad request (invalid JSON, missing path on a Download event)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Path is outside the configured media roots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Sonarr or Radarr retries the webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Event forwarded to Autoscan but every instance failed or rejected it
          content:
            application/json:
              schema:
                type: object

  /webhook/radarr:
    post:
      summary: Native Radarr webhook endpoint
      description: |
        Accepts a native Radarr webhook payload for any event type.
        Extracts `movieFile.path` and `movie.tmdbId` (or `imdbId` as fallback),
        then queues the file for conversion.  Test events return 200 without queuing.
        Only `Download` is queued for conversion. Every other eventType (Grab,
        Rename, file/series/movie delete, Health, ...) is forwarded unchanged to
        `/triggers/<sonarr|radarr>` on each matching `services.autoscan` instance
        and answered with 200 (`forwarded` / `ignored`) or 502 when every forward fails.
      operationId: radarrWebhook
      tags: [conversion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType]
              properties:
                eventType:
                  type: string
                  description: "`Download` queues a job, `Test` is acknowledged, all others are forwarded to Autoscan"
                movieFile:
                  type: object
                  properties:
                    path:
                      type: string
                      description: Absolute path to the imported movie file
                movie:
                  type: object
                  properties:
                    tmdbId:
                      type: integer
                    imdbId:
                      type: string
            example:
              eventType: Download
              movieFile:
                path: /mnt/unionfs/Media/Movies/The Matrix (1999).mkv
              movie:
                tmdbId: 603
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: queued
                  job_id:
                    type: integer
                  path:
                    type: string
                  config:
                    type: string
        "200":
          description: Test event acknowledged, duplicate job, or non-Download event forwarded/ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: "`ok`, `forwarded`, or `ignored` (no matching Autoscan instance)"
                  eventType:
                    type: string
                  forwarded:
                    type: array
                    items:
                      type: object
                      properties:
                        instance:
                          type: string
                        status:
                          type: integer
                          nullable: true
                          description: HTTP status from Autoscan, null when the request failed
        "400":
          description: Bad request (invalid JSON, missing path on a Download event)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Path is outside the configured media roots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected error. Sonarr or Radarr retries the webhook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Event forwarded to Autoscan but every instance failed or rejected it
          content:
            application/json:
              schema:
                type: object

  /configs:
    get:
      summary: Show path-to-config mappings
      operationId: getConfigs
      tags: [configuration]
      responses:
        "200":
          description: Current path mappings and per-config status
          content:
            application/json:
              schema:
                type: object
                properties:
                  default_config:
                    type: string
                  default_args:
                    type: array
                    items:
                      type: string
                  default_log:
                    type: string
                  default_log_name:
                    type: string
                    description: Log name for the default config (e.g. "sma-ng")
                  default_active_jobs:
                    type: array
                  default_pending_jobs:
                    type: integer
                  routing:
                    type: array
                    description: The daemon.routing rules, longest match first
                    items:
                      type: object
                      properties:
                        match:
                          type: string
                        profile:
                          type: string
                          nullable: true
                        services:
                          type: array
                          items:
                            type: string
                  logs_directory:
                    type: string

  /cleanup:
    post:
      summary: Remove old completed, failed and cancelled jobs
      description: >-
        Jobs completed within daemon.job-dedupe-window-seconds are never removed; scanned_files is not touched. The daemon runs the same pass hourly only when daemon.job-retention-days is above 0 (default 0 keeps jobs forever). The days parameter is required; a request without it returns 400. This permanently deletes job rows; their counts move to the lifetime totals (job_stats_archive), so /stats does not drop.
      operationId: cleanup
      tags: [jobs]
      parameters:
        - name: days
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "400":
          description: Missing or invalid days parameter
        "200":
          description: Cleanup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                  days:
                    type: integer

  /reload:
    post:
      summary: Reload daemon configuration in-place
      description: >
        Re-reads sma-ng.yml in the background without restarting workers or active conversions. The response
        is immediate. A config that fails validation keeps the previous settings. The daemon also reloads
        automatically when the file changes (daemon.config-watch).
      operationId: reload
      tags: [management]
      responses:
        "200":
          description: Reload initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: reloading

  /restart:
    post:
      summary: Gracefully restart the daemon
      description: >
        Waits for active conversions to finish (up to daemon.shutdown-grace-seconds, then they are requeued),
        then re-execs the process. In PostgreSQL mode the request queues a command instead: with `node` it targets
        that node, without it every online node restarts.
      operationId: restart
      tags: [management]
      parameters:
        - name: node
          in: query
          required: false
          description: Node id to restart (PostgreSQL mode only)
          schema:
            type: string
      responses:
        "202":
          description: Restart initiated, or queued for the targeted nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: "`restarting` for this daemon, `restart_requested` when queued for nodes"
                    example: restarting
                  active_jobs:
                    type: integer
                    description: Jobs running on this daemon (local restart only)
                  nodes:
                    type: array
                    description: Nodes that received the command (queued restart only)
                    items:
                      type: string

  /shutdown:
    post:
      summary: Gracefully shut down the daemon
      description: >
        Waits for active conversions to finish (up to daemon.shutdown-grace-seconds, then they are requeued),
        then exits. In PostgreSQL mode the request queues a command instead: with `node` it targets that node,
        without it every online node shuts down.
      operationId: shutdown
      tags: [management]
      parameters:
        - name: node
          in: query
          required: false
          description: Node id to shut down (PostgreSQL mode only)
          schema:
            type: string
      responses:
        "202":
          description: Shutdown initiated, or queued for the targeted nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: "`shutting_down` for this daemon, `shutdown_requested` when queued for nodes"
                    example: shutting_down
                  active_jobs:
                    type: integer
                    description: Jobs running on this daemon (local shutdown only)
                  nodes:
                    type: array
                    description: Nodes that received the command (queued shutdown only)
                    items:
                      type: string

  /admin/nodes/{nodeId}/{action}:
    post:
      summary: Perform an admin action on a cluster node
      description: |
        Distributed-mode node management endpoint used by the admin page.
        `approve` and `reject` set the approval state. `drain`, `pause`, `resume`, `restart` and `shutdown`
        queue a command that the node runs on its next heartbeat. `delete` removes the node from the registry.
        `push-config` stores this daemon's config (secrets stripped) as the shared cluster base config.
      operationId: adminNodeAction
      tags: [management]
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [approve, reject, drain, pause, resume, restart, shutdown, delete, push-config]
        - name: X-Actor
          in: header
          required: false
          description: Name recorded as the requester (default `admin-ui`)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Optional approval or rejection note
      responses:
        "200":
          description: Approval, rejection, delete or push-config completed
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Drain, pause, resume, restart or shutdown command queued for the target node
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: drain_requested
                  nodes:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Node not found or unknown action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: push-config on a daemon that has no config file loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/config:
    get:
      summary: Read the shared cluster base config
      description: Returns the base config stored in the database, or an empty object when none is stored.
      operationId: getClusterConfig
      tags: [management]
      responses:
        "200":
          description: Stored base config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    additionalProperties: true
        "503":
          description: Not in distributed (PostgreSQL) mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Store the shared cluster base config
      description: >
        Secrets (api-key, db-url, username, password, node-id and service credentials) are stripped before the
        config is stored. The body may be `{"config": {...}}` or the config object itself.
      operationId: setClusterConfig
      tags: [management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: saved
        "400":
          description: Invalid JSON, or the config is not an object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Not in distributed (PostgreSQL) mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/delete-failed:
    post:
      summary: Delete every failed job
      description: Permanent. The deleted jobs still count toward the lifetime totals.
      operationId: deleteFailedJobs
      tags: [management]
      responses:
        "200":
          description: Jobs deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /admin/delete-offline-nodes:
    post:
      summary: Delete every node that is not online
      operationId: deleteOfflineNodes
      tags: [management]
      responses:
        "200":
          description: Nodes deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /admin/delete-all-jobs:
    post:
      summary: Delete every job
      description: Permanent. Finished jobs still count toward the lifetime totals. Running jobs are not counted.
      operationId: deleteAllJobs
      tags: [management]
      responses:
        "200":
          description: Jobs deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /cluster/logs:
    get:
      summary: Aggregated cluster logs
      description: Log entries from every node, newest first. PostgreSQL only.
      operationId: getClusterLogs
      tags: [logs]
      parameters:
        - name: node_id
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        - name: limit
          in: query
          description: Page size, capped at 500
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id:
                          type: string
                        level:
                          type: string
                        logger:
                          type: string
                        message:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                  total:
                    type: integer
                    description: Number of entries returned
        "503":
          description: Not in distributed (PostgreSQL) mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scan:
    get:
      summary: Filter a list of paths to those not yet scanned
      description: Useful for incremental directory scans. For large lists use POST /scan/filter.
      operationId: getScan
      tags: [scanning]
      parameters:
        - name: path
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Unscanned paths
          content:
            application/json:
              schema:
                type: object
                properties:
                  unscanned:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
                  already_scanned:
                    type: integer

  /scan/filter:
    post:
      summary: Filter a list of paths to those not yet scanned (bulk)
      operationId: scanFilter
      tags: [scanning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Unscanned paths
          content:
            application/json:
              schema:
                type: object
                properties:
                  unscanned:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
                  already_scanned:
                    type: integer

  /scan/record:
    post:
      summary: Record paths as scanned
      operationId: scanRecord
      tags: [scanning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Paths recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: integer

  /browse:
    get:
      summary: Browse directories and media files
      description: Lists directories and media files under a configured path. Returns top-level roots if no path is given.
      operationId: browse
      tags: [files]
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: Absolute path to browse (must be under a configured media root; symlinks are resolved; ancestors of a root list only entries leading to it)
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  dirs:
                    type: array
                    items:
                      type: string
                  files:
                    type: array
                    items:
                      type: string
        "403":
          description: Path is outside configured roots or permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Directory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logs:
    get:
      summary: List all log files
      operationId: listLogs
      tags: [logs]
      responses:
        "200":
          description: Log file metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogFile"

  /logs/{name}:
    get:
      summary: Get log content
      operationId: getLogContent
      tags: [logs]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Log name (config file stem, e.g. "sma-ng")
        - name: lines
          in: query
          schema:
            type: integer
            default: 500
            maximum: 2000
          description: Maximum entries to return (newest first kept; ignored when offset is given)
        - name: level
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
          description: Minimum log level filter
        - name: job_id
          in: query
          schema:
            type: integer
          description: Filter entries to a specific job. Scans the live log and the rotated backups (.1 to .5), so jobs that scrolled out of the tail still return their entries (oldest first, newest `lines` kept)
        - name: offset
          in: query
          schema:
            type: integer
          description: Return content starting from this byte offset
      responses:
        "200":
          description: Log entries and current file size
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogEntry"
                  file_size:
                    type: integer
        "400":
          description: Invalid lines or offset value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown log name, or a file that resolves outside the logs directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logs/{name}/tail:
    get:
      summary: Poll for new log entries after a byte offset
      description: Returns entries written after the given byte offset. Use `file_size` from each response as the next `offset`. Resets automatically on log rotation.
      operationId: tailLog
      tags: [logs]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          required: true
          schema:
            type: integer
          description: Byte offset from a previous response's file_size
        - name: level
          in: query
          schema:
            type: string
            enum: [DEBUG, INFO, WARNING, ERROR, CRITICAL]
        - name: job_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: New log entries since offset
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogEntry"
                  file_size:
                    type: integer
        "400":
          description: The offset parameter is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown log name, or a file that resolves outside the logs directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/audit:
    get:
      summary: List recent library-audit runs
      operationId: listLibraryAuditRuns
      tags: [library-audit]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: >
            Paginated list of audit runs (most recent first). On a SQLite daemon the list is empty and the body
            carries `available: false` with a reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryAuditRun"
                  count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
    post:
      summary: Trigger an on-demand library audit
      description: |
        Creates a new audit run and returns immediately (202). Path enumeration
        and per-file probing happen asynchronously across every cluster node.
        The body is optional; omit `paths` (or the body) to use the enabled entries of
        `daemon.audit.paths`. Returns 409 on a SQLite daemon.
      operationId: triggerLibraryAudit
      tags: [library-audit]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items:
                    type: string
                dry_run:
                  type: boolean
                  deprecated: true
                  description: >
                    Accepted but ignored. Auto-fix behaviour is set by daemon.audit.dry_run (default true).
      responses:
        "202":
          description: Audit run queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: queued
                  audit_id:
                    type: integer
                  paths:
                    type: array
                    items:
                      type: string
        "400":
          description: No audit paths supplied or configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Library audit needs PostgreSQL cluster mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/audit/{id}:
    get:
      summary: Get a single audit run with per-node progress
      operationId: getLibraryAuditRun
      tags: [library-audit]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryAuditRun"
        "404":
          description: Audit run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/findings:
    get:
      summary: List library-audit findings
      operationId: listLibraryFindings
      tags: [library-audit]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acked, dismissed, resolved]
        - name: kind
          in: query
          schema:
            type: string
            enum: [ffprobe_failed, orphan_sidecar, leftover_tmp, preconv_original, duplicate_id]
        - name: path
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: >
            Paginated findings list. On a SQLite daemon the list is empty and the body carries
            `available: false` with a reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings:
                    type: array
                    items:
                      $ref: "#/components/schemas/LibraryFinding"
                  count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /library/findings/{id}:
    get:
      summary: Get a single library finding
      operationId: getLibraryFinding
      tags: [library-audit]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finding details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFinding"
        "404":
          description: Finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /library/findings/{id}/ack:
    post:
      summary: Acknowledge a finding (operator has seen it)
      operationId: ackLibraryFinding
      tags: [library-audit]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finding acked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: acked
                  finding_id:
                    type: integer
        "404":
          description: Finding not found
        "409":
          description: Library audit needs PostgreSQL cluster mode

  /library/findings/{id}/dismiss:
    post:
      summary: Dismiss a finding (operator wants it suppressed unless it recurs)
      operationId: dismissLibraryFinding
      tags: [library-audit]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finding dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: dismissed
                  finding_id:
                    type: integer
        "404":
          description: Finding not found
        "409":
          description: Library audit needs PostgreSQL cluster mode

  /library/findings/{id}/resolve:
    post:
      summary: Mark a finding resolved (the underlying issue has been fixed)
      operationId: resolveLibraryFinding
      tags: [library-audit]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Finding resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: resolved
                  finding_id:
                    type: integer
        "404":
          description: Finding not found
        "409":
          description: Library audit needs PostgreSQL cluster mode
